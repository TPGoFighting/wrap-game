name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot 4.7.2 Headless & Export Templates
        run: |
          # 1. Download Godot Headless Engine binary
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

          # 2. Download and unpack Android Export Templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          echo "Downloading export templates..."
          curl -sSL -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q templates.tpz "templates/android_*" "templates/version.txt" -d /tmp/tmpl
          mv /tmp/tmpl/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          ls -lh ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Generate Android Keystore & Configure Godot Settings
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.7.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Build Android APK with Godot
        run: |
          mkdir -p build
          OUTPUT_APK="$(pwd)/build/WRAP.apk"
          godot -v --headless --path unpacked_pck_opt --export-release "Android" "$OUTPUT_APK"

      - name: Verify APK Output
        run: |
          ls -lh build/
          if [ ! -f "build/WRAP.apk" ]; then
            echo "Error: build/WRAP.apk not found!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WRAP-Android-v0.9.0
          path: build/WRAP.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.9.0-android build/WRAP.apk \
            --title "WRAP · 星际远征 v0.9.0 (Android APK)" \
            --notes "🚀 《WRAP · 星际远征》v0.9.0 原生横屏 Android APK 安装包。基于 Godot 4.7.2 原生 arm64/x86_64 引擎与极速 18MB 优化资产构建。" \
            || gh release upload v0.9.0-android build/WRAP.apk --clobber
