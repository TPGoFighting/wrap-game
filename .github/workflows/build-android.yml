name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check & Prepare Android SDK
        run: |
          echo "ANDROID_HOME is $ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Godot 4.7.2 Headless & Export Templates
        run: |
          # 1. Download Godot Headless Engine binary
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

          # 2. Download and unpack Android Export Templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          echo "Downloading export templates..."
          curl -sSL -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q templates.tpz "templates/android_*" "templates/version.txt" -d /tmp/tmpl
          mv /tmp/tmpl/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          ls -lh ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Generate Android Keystore & Configure Godot Settings
        run: |
          mkdir -p /home/runner/.android
          # Debug Keystore (backdated startdate to ensure valid across all device clocks)
          keytool -genkey -v -keystore /home/runner/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 20000 \
            -startdate "2020/01/01 00:00:00" \
            -dname "CN=Android Debug,O=Android,C=US"

          # Release Keystore (backdated startdate to 2020 to prevent future certificate errors)
          keytool -genkey -v -keystore /home/runner/.android/release.keystore \
            -storepass wrap_password_123 -alias wrapkey -keypass wrap_password_123 \
            -keyalg RSA -keysize 2048 -validity 20000 \
            -startdate "2020/01/01 00:00:00" \
            -dname "CN=WRAP Game,O=TPGoFighting,C=CN"

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.7.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/release_keystore = "/home/runner/.android/release.keystore"
          export/android/release_keystore_user = "wrapkey"
          export/android/release_keystore_pass = "wrap_password_123"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Build Android Base APK with Godot
        run: |
          mkdir -p build
          godot -v --headless --path unpacked_pck_opt --export-release "Android" "$(pwd)/build/WRAP_base.apk"

      - name: Package Full Game PCK into APK & Sign Release
        run: |
          # 1. Locate Android build tools (zipalign, apksigner, aapt)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"
          echo "Using aapt: $AAPT"

          # 2. Inject complete 18MB WRAP.pck and Android boot settings
          python3 tools/package_android_apk.py build/WRAP_base.apk web_build/WRAP.pck build/WRAP_unaligned.apk

          # 3. Zipalign APK (4-byte alignment for uncompressed assets)
          "$ZIPALIGN" -p -f 4 build/WRAP_unaligned.apk build/WRAP_aligned.apk

          # 4. Sign release APK with explicit v1, v2, v3 schemes
          "$APKSIGNER" sign --ks /home/runner/.android/release.keystore \
            --ks-pass pass:wrap_password_123 \
            --ks-key-alias wrapkey \
            --key-pass pass:wrap_password_123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/WRAP.apk build/WRAP_aligned.apk

          # 5. Verify Signature
          "$APKSIGNER" verify --verbose build/WRAP.apk

          # 6. Verify Package Badging (Landscape, Package name, Activity)
          "$AAPT" dump badging build/WRAP.apk | grep -E "package|screenOrientation|application-label|launchable-activity"

      - name: Verify APK Output
        run: |
          ls -lh build/
          if [ ! -f "build/WRAP.apk" ]; then
            echo "Error: build/WRAP.apk not found!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WRAP-Android-v0.9.0
          path: build/WRAP.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.9.0-android build/WRAP.apk \
            --title "WRAP · 星际远征 v0.9.0 (Android APK)" \
            --notes "🚀 《WRAP · 星际远征》v0.9.0 官方原生横屏 Android APK 安装包。基于 Godot 4.7.2 原生 arm64/x86_64 引擎与极速 18MB 优化资产构建。" \
            || gh release upload v0.9.0-android build/WRAP.apk --clobber
