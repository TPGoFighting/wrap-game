<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<title>WRAP · 星际远征 v0.9.0 - Web版</title>
	<meta name="description" content="WRAP · 星际远征 v0.9.0 网页在线畅玩版">
	<meta name="theme-color" content="#0a0c10">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
	<style>
		* {
			box-sizing: border-box;
		}
		html, body {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100%;
			background-color: #08090d;
			color: #e2e8f0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
			overflow: hidden;
			user-select: none;
			-webkit-user-select: none;
			touch-action: none;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			outline: none;
		}

		#loading-container {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			background: radial-gradient(circle at center, #141b2d 0%, #08090d 100%);
			z-index: 100;
			transition: opacity 0.5s ease;
		}

		.brand-badge {
			display: inline-block;
			padding: 4px 12px;
			background: rgba(56, 189, 248, 0.15);
			border: 1px solid rgba(56, 189, 248, 0.35);
			border-radius: 9999px;
			color: #38bdf8;
			font-size: 13px;
			font-weight: 600;
			letter-spacing: 1px;
			margin-bottom: 12px;
			text-transform: uppercase;
		}

		.game-title {
			font-size: 36px;
			font-weight: 800;
			letter-spacing: 2px;
			background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin: 0 0 6px 0;
		}

		.game-subtitle {
			font-size: 15px;
			color: #64748b;
			margin: 0 0 32px 0;
			letter-spacing: 1px;
		}

		.progress-box {
			width: 380px;
			max-width: 85vw;
			background: rgba(15, 23, 42, 0.8);
			border: 1px solid rgba(148, 163, 184, 0.2);
			border-radius: 12px;
			padding: 20px;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
		}

		.progress-info {
			display: flex;
			justify-content: space-between;
			font-size: 14px;
			color: #94a3b8;
			margin-bottom: 10px;
		}

		.progress-bar-bg {
			width: 100%;
			height: 8px;
			background: rgba(30, 41, 59, 0.8);
			border-radius: 4px;
			overflow: hidden;
			position: relative;
		}

		.progress-bar-fill {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, #0284c7 0%, #38bdf8 100%);
			border-radius: 4px;
			transition: width 0.15s ease-out;
		}

		.tips {
			margin-top: 18px;
			font-size: 12px;
			color: #64748b;
			text-align: center;
			line-height: 1.5;
		}

		#status-notice {
			display: none;
			margin-top: 20px;
			padding: 12px 18px;
			background: rgba(239, 68, 68, 0.15);
			border: 1px solid rgba(239, 68, 68, 0.4);
			border-radius: 8px;
			color: #fca5a5;
			font-size: 14px;
			max-width: 450px;
			text-align: center;
			word-break: break-word;
		}

		/* Fullscreen Floating Button */
		#fs-btn {
			position: absolute;
			right: 16px;
			bottom: 16px;
			z-index: 50;
			background: rgba(15, 23, 42, 0.7);
			border: 1px solid rgba(148, 163, 184, 0.3);
			color: #cbd5e1;
			border-radius: 8px;
			padding: 8px 14px;
			font-size: 13px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 6px;
			transition: all 0.2s;
			backdrop-filter: blur(8px);
		}
		#fs-btn:hover {
			background: rgba(30, 41, 59, 0.9);
			color: #ffffff;
			border-color: rgba(56, 189, 248, 0.6);
		}
	</style>
</head>
<body>
	<canvas id="canvas">
		您的浏览器不支持 HTML5 Canvas，请使用最新版 Chrome 浏览器。
	</canvas>

	<div id="loading-container">
		<span class="brand-badge">WEB 移植增强版</span>
		<h1 class="game-title">WRAP · 星际远征</h1>
		<p class="game-subtitle">v0.9.0 · 跨平台浏览器即开即玩</p>

		<div class="progress-box">
			<div class="progress-info">
				<span id="progress-status">正在连接资源...</span>
				<span id="progress-pct">0%</span>
			</div>
			<div class="progress-bar-bg">
				<div id="progress-bar" class="progress-bar-fill"></div>
			</div>
			<div class="tips">
				💡 存档与卡组自动保存在浏览器本地（IndexedDB），下次打开直接继续。
			</div>
		</div>

		<div id="status-notice"></div>
	</div>

	<button id="fs-btn" onclick="toggleFullscreen()">
		<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
			<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
		</svg>
		全屏模式
	</button>

	<script src="WRAP.js"></script>
	<script>
		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"ensureCrossOriginIsolationHeaders": false,
			"executable": "WRAP",
			"experimentalVK": false,
			"fileSizes": {
				"WRAP.pck": 18870128,
				"WRAP.wasm": 39514754
			},
			"focusCanvas": true,
			"gdextensionLibs": [],
			"mainPack": "WRAP.pck"
		};

		const engine = new Engine(GODOT_CONFIG);

		const loadingContainer = document.getElementById('loading-container');
		const progressBar = document.getElementById('progress-bar');
		const progressPct = document.getElementById('progress-pct');
		const progressStatus = document.getElementById('progress-status');
		const statusNotice = document.getElementById('status-notice');

		function displayError(err) {
			console.error(err);
			statusNotice.style.display = 'block';
			statusNotice.textContent = '启动失败: ' + (err && err.message ? err.message : String(err));
			progressStatus.textContent = '加载出错';
		}

		// Check browser features
		const missing = Engine.getMissingFeatures({ threads: false });
		if (missing.length !== 0) {
			displayError('当前浏览器缺少运行游戏所需的功能: ' + missing.join(', ') + '。建议使用最新版 Google Chrome 浏览器。');
		} else {
			progressStatus.textContent = '加载游戏核心与资源...';
			engine.startGame({
				onProgress: function(current, total) {
					if (total > 0) {
						const pct = Math.min(100, Math.round((current / total) * 100));
						progressBar.style.width = pct + '%';
						progressPct.textContent = pct + '%';
						const currentMB = (current / (1024 * 1024)).toFixed(1);
						const totalMB = (total / (1024 * 1024)).toFixed(1);
						progressStatus.textContent = `加载中... (${currentMB}MB / ${totalMB}MB)`;
					} else {
						progressStatus.textContent = '加载中...';
					}
				}
			}).then(() => {
				// Fade out loader
				loadingContainer.style.opacity = '0';
				setTimeout(() => {
					loadingContainer.remove();
				}, 500);
			}).catch(displayError);
		}

		function toggleFullscreen() {
			if (!document.fullscreenElement) {
				document.documentElement.requestFullscreen().catch(() => {});
			} else {
				if (document.exitFullscreen) {
					document.exitFullscreen().catch(() => {});
				}
			}
		}
	</script>
</body>
</html>
